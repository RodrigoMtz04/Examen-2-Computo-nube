version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: fitness_bands_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
      MYSQL_DATABASE: fitness_bands_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10
      interval: 5s
    networks:
      - fitness_network

volumes:
  mysql_data:

networks:
  fitness_network:
    driver: bridge

