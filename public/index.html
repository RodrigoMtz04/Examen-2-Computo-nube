<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iHealth - Recomendador Naive Bayes</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Recomendador iHealth (Naive Bayes)</h1>
    <p class="muted">
      Completa el formulario. Con base en tus respuestas, el sistema recomienda uno de los 2 modelos: <b>i100</b> o <b>i500</b>.
    </p>

    <section class="card">
      <h2>1) Preferencias</h2>
      <form id="form">
        <div class="grid">
          <label>
            CTD
            <select name="ctd" required>
              <option value="">Selecciona…</option>
              <option value="Y">Y</option>
              <option value="N">N</option>
            </select>
          </label>

          <label>
            HM
            <select name="hm" required>
              <option value="">Selecciona…</option>
              <option value="M">M</option>
              <option value="A">A</option>
            </select>
          </label>

          <label>
            CEL
            <select name="cel" required>
              <option value="">Selecciona…</option>
              <option value="S">S</option>
              <option value="A">A</option>
              <option value="M">M</option>
            </select>
          </label>

          <label>
            MI
            <select name="mi" required>
              <option value="">Selecciona…</option>
              <option value="H">H</option>
              <option value="A">A</option>
              <option value="B">B</option>
            </select>
          </label>
        </div>

        <button type="submit">Recomendar</button>
      </form>

      <div id="result" class="result" hidden>
        <h3>Resultado</h3>
        <div id="resultText"></div>
      </div>
    </section>

    <section id="buySection" class="card" hidden>
      <h2>2) Comprar</h2>
      <form id="buyForm">
        <div class="grid">
          <label>
            Nombre
            <input name="nombre" required />
          </label>
          <label>
            Email
            <input name="email" type="email" required />
          </label>
          <label>
            Teléfono
            <input name="telefono" />
          </label>
        </div>
        <button type="submit">Comprar recomendación</button>
        <div id="buyMsg" class="muted"></div>
      </form>
    </section>

    <footer class="muted">
      <small>Demo académico: Naive Bayes + Laplace + MySQL.</small>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
